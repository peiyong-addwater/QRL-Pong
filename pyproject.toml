[tool.poetry]
name = "qrl-pong"
version = "0.0.1"
description = "Simple quantum-circuit-based agent to play the Atari game Pong"
authors = ["Peiyong Wang, Danjo Dechavez, Kieran Hymas and James Quach"]
license = "GPLv3"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.12.9"
torch = "^2.5.1"
torchvision = "^0.20.1"
torchaudio = "^2.5.1"
pennylane = "^0.40.0"
gymnasium = {extras = ["all"], version = "^1.1.1"}
ale-py = "^0.10.2"
wandb = {extras = ["media"], version = "^0.19.8"}
jax = {extras = ["cuda12"], version = "^0.5.3"}
flax = "^0.10.5"
multi-agent-ale-py = "^0.1.11"
pettingzoo = "^1.24.3"
supersuit = "^3.9.3"
autorom = "^0.6.1"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
